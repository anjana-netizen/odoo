
[options]
; Database connection can be provided by environment variables:
;   PGHOST, PGPORT, PGUSER, PGPASSWORD
; db_host = 127.0.0.1
; db_port = 5432
; db_user = odoo
; db_password =
; Admin password for database operations
; admin_passwd = admin
; You can also set the admin password via the environment variable ODOO_ADMIN_PASSWD.

; Addons path - include custom addons and system addons
addons_path = /app/addons,/app/custom-addons,/usr/lib/python3/dist-packages/odoo/addons

; Cloud Run port configuration: set ODOO_HTTP_PORT instead of using ${PORT}
; http_port = ${PORT}

; Enable default productivity apps
default_productivity_apps = True
; Additional Cloud Run optimizations
workers = 2
limit_memory_hard = 2147483648
limit_memory_soft = 1610612736
unaccent = True
without_demo = False
