
[options]
; Database connection (use environment variables in Cloud Run)
db_host = ${DB_HOST}
db_port = ${DB_PORT}
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}
; Admin password for database operations
admin_passwd = ${ADMIN_PASSWORD}

; Addons path - include custom addons and system addons
addons_path = /app/addons,/app/custom-addons,/usr/lib/python3/dist-packages/odoo/addons

; Cloud Run port configuration
http_port = ${PORT}
; Enable default productivity apps
default_productivity_apps = True
; Additional Cloud Run optimizations
workers = 2
limit_memory_hard = 2147483648
limit_memory_soft = 1610612736
unaccent = True
without_demo = False
